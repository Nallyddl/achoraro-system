services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: achoraro-system-frontend
    ports:
      - "3000:3000" # frontend/API unificada corriendo en el puerto 3000
    environment:
      - NODE_ENV=production
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: achoraro-system-backend
    ports:
      - "4000:4000" # Lo movemos al 4000 para que libere el puerto 3000
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: achoraro-system-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: achorao
    ports:
      - "5432:5432"